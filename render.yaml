services:
  - type: web
    name: samudra-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
